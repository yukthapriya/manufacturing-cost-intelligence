# IRSA: pods running as mci-runner assume the pipeline role created by
# infra/terraform (output pipeline_role_arn). No static AWS keys in prod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mci-runner
  namespace: mci
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<PIPELINE_ROLE_NAME>

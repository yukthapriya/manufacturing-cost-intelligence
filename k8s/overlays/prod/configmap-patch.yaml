apiVersion: v1
kind: ConfigMap
metadata:
  name: mci-config
  namespace: mci
data:
  WAREHOUSE_HOST: <RDS_ENDPOINT_HOSTNAME>   # terraform output rds_address
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: mfg_cost
  WAREHOUSE_USER: mci
  # Single raw-landing bucket from terraform (output raw_bucket_name); source
  # drop and raw zone are prefixes within it.
  SOURCE_URI: s3://<RAW_BUCKET_NAME>/source
  RAW_URI: s3://<RAW_BUCKET_NAME>/raw
  # Empty => boto3 uses the regional AWS S3 endpoint.
  S3_ENDPOINT_URL: ""
  AWS_DEFAULT_REGION: us-east-1
  LOG_LEVEL: INFO
  MATERIALITY_USD: "1000"
  EXECUTION_MODE: k8s
  # Pinned release; workload images are <ECR_REGISTRY>/mci-*:<this tag>.
  MCI_IMAGE_TAG: 0.1.0
  K8S_NAMESPACE: mci

# Namespace-scoped permissions for mci-runner:
#  - KubernetesPodOperator: create/watch/delete pods, read logs, exec (xcom sidecar)
#  - Airflow scheduler/triggerer: list pods & events for status
#  - Argo Workflows executor (emissary): workflowtaskresults + pod patching
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mci-runner
  namespace: mci
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  # Argo Workflows >= 3.4 executor reports step outputs via this CRD.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  # Allows a CronWorkflow/onExit step or Airflow to submit Argo workflows.
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mci-runner
  namespace: mci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mci-runner
subjects:
  - kind: ServiceAccount
    name: mci-runner
    namespace: mci

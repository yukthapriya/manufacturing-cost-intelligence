# Creates the landing buckets. Idempotent; safe to re-apply (delete the
# completed Job first, or rely on ttlSecondsAfterFinished).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: mci
  labels:
    app.kubernetes.io/name: minio-init
spec:
  backoffLimit: 10          # retries while MinIO is still starting
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc       # writable as non-root
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: mci-secrets, key: AWS_ACCESS_KEY_ID}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mci-secrets, key: AWS_SECRET_ACCESS_KEY}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mc alias set mci http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing mci/mci-source
              mc mb --ignore-existing mci/mci-raw
              mc version enable mci/mci-raw
              echo "buckets ready"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

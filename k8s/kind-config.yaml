# kind cluster for local Kubernetes runs:
#   kind create cluster --name mci --config k8s/kind-config.yaml
#   kind load docker-image mci-airflow:0.1.0 mci-loader:0.1.0 ... --name mci
# The Airflow webserver Service is a NodePort on 30080 (k8s/airflow/values.yaml);
# the mapping below exposes it on the host at http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mci
nodes:
  - role: control-plane
    image: kindest/node:v1.30.4
  - role: worker
    image: kindest/node:v1.30.4
    extraPortMappings:
      - containerPort: 30080   # Airflow webserver NodePort
        hostPort: 8080
        protocol: TCP
      - containerPort: 30090   # optional MinIO console NodePort (not created by default)
        hostPort: 9001
        protocol: TCP

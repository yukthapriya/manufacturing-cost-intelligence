name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-test:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest -m "not integration"

  dbt-integration:
    name: end-to-end (generate -> land -> load -> dbt)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mfg_cost
          POSTGRES_USER: mci
          POSTGRES_PASSWORD: mci_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mci -d mfg_cost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: mfg_cost
      WAREHOUSE_USER: mci
      WAREHOUSE_PASSWORD: mci_ci_password
      # Filesystem storage: no MinIO/S3 in CI.
      SOURCE_URI: ./data/source_drop
      RAW_URI: ./data/raw
      LOG_LEVEL: INFO
      MATERIALITY_USD: "1000"
      EXECUTION_MODE: local
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dbt.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-dbt.txt

      - name: Generate synthetic source data
        run: >-
          python -m data_generator.generate
          --start 2025-01-01 --months 2 --scale 0.05 --seed 7
          --out ./data/source_drop

      - name: Initialise warehouse schema
        run: python -m ingestion.load --init-db

      - name: Land and load every business date
        run: |
          set -euo pipefail
          for d in $(python -m ingestion.list_dates --src ./data/source_drop); do
            python -m ingestion.land --date "$d"
            python -m ingestion.load --date "$d"
          done

      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Publish dbt test results
        run: python -m quality.publish_dq --run-results dbt/target/run_results.json

      - name: Integration tests
        run: pytest -m integration

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            dbt/logs/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        image: [generator, loader, dbt, exporter, airflow]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build mci-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: mci-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=mci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=mci-${{ matrix.image }}

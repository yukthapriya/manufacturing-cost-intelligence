mci:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'mfg_cost') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'postgres') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', '') }}"
      schema: analytics
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      keepalives_idle: 0
      connect_timeout: 10
